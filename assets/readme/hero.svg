<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">fnOS Monitor — 飞牛 NAS 的桌面状态屏</title>
  <desc id="desc">负载、流量、容量与温度，一眼可见。面向 ESP32-P4 的七英寸横屏监控仪表。</desc>
  <rect width="1200" height="300" rx="20" fill="#101212"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="56" y="62" font-size="22" font-weight="600" fill="#8ED5DF">NAS TELEMETRY / 7″ TOUCH DISPLAY</text>
    <text x="52" y="150" font-size="76" font-weight="750" letter-spacing="-2" fill="#F5F5F2">fnOS Monitor</text>
    <text x="56" y="210" font-size="34" font-weight="500" fill="#F5F5F2">负载、流量、容量与温度，一眼可见。</text>
    <text x="56" y="263" font-size="20" fill="#A7B2B2">ESP32-P4   /   1024 × 600   /   LVGL   /   HTTPS</text>
  </g>
  <g transform="translate(994 64)" fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M 0 104 A 76 76 0 1 1 108 104" stroke="#303738"/>
    <path d="M 0 104 A 76 76 0 0 1 0 -4" stroke="#8ED5DF"/>
    <path d="M 54 50 L 84 12" stroke="#F5F5F2" stroke-width="6"/>
    <circle cx="54" cy="50" r="8" fill="#F5F5F2" stroke="none"/>
  </g>
</svg>
