name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: build + host checks
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.5.5
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two checks diff against older commits; a shallow clone cannot see them.
          fetch-depth: 0

      - name: Host tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nodejs openssl git ca-certificates build-essential clang libclang-rt-18-dev
          node --version
          openssl version
          # The host tests build with ASan/UBSan; prove that link path works
          # before the suite, so a missing runtime shows up as one clear line.
          printf 'int main(void){return 0;}\n' > /tmp/san.c
          cc -std=c11 -fsanitize=address,undefined /tmp/san.c -o /tmp/san
          /tmp/san
          echo "host sanitizers: ok"

      # The component manager downloads LVGL 9.6 and the ESP-IDF adapters on the
      # first build; dependencies.lock pins the exact set.
      # actions/checkout runs inside the container as root while the workspace
      # is owned by the runner user; the checks shell out to `git describe`.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-${{ hashFiles('dependencies.lock') }}

      # The host preview compiles against build/config/sdkconfig.h, so the
      # firmware build has to happen before the host checks.
      - name: Firmware build
        run: |
          set -euo pipefail
          # The image ships the toolchain but not an activated shell; export.sh
          # is what puts the IDF python env on IDF_PYTHON_ENV_PATH.
          . "$IDF_PATH/export.sh" > /dev/null
          bash idf.sh build

      - name: Host checks, stack budget and UI exit check
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          VERIFY_OUT="$RUNNER_TEMP/fnos-verify" bash tools/verify_all.sh --ci 2>&1 | tee "$RUNNER_TEMP/verify.log"

      # A build that re-solves the lock silently ships dependencies nobody reviewed.
      - name: Lockfile stayed pinned
        run: |
          set -euo pipefail
          if ! git diff --quiet -- dependencies.lock; then
            git diff -- dependencies.lock
            echo "::error::dependencies.lock changed during build; commit the intended lock update"
            exit 1
          fi

      # verify_all rebuilds; package the final build, not the pre-check one.
      - name: Package flash release
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          out="$RUNNER_TEMP/fnos-verify/release"
          mkdir -p "$out"
          cat > build/FLASH.txt <<'EOF'
          fnos_monitor — ESP32-P4 7B 通用固件

          下载 fnos-monitor-*-full.zip 并解压，进入解压后的目录执行：

            esptool.py --chip esp32p4 -p <PORT> -b 460800 write_flash @flash_args

          说明：
            * 必须使用包内 flash_args；esptool 的 @文件只接受文本参数。
            * 不要对 flasher_args.json 使用 @。
            * 完整烧录写入 0x2000 bootloader、0x8000 分区表、0x10000 应用。
            * 适用 ESP32-P4 7B rev3.x / 32MB flash；不要执行 erase_flash。
            * 固件由 gate 构建；.fpk 请在本地构建。
          EOF
          (cd build && zip -q -X "$out/fnos-monitor-full.zip" \
            FLASH.txt flash_args flasher_args.json fnos_monitor.bin \
            fnos_monitor.elf fnos_monitor.map \
            bootloader/bootloader.bin partition_table/partition-table.bin)
          cp build/FLASH.txt "$out/FLASH.txt"
          extract="$RUNNER_TEMP/fnos-unzip"
          unzip -oq "$out/fnos-monitor-full.zip" -d "$extract"
          (cd "$extract" && python -m esptool --chip esp32p4 merge_bin \
            -o "$RUNNER_TEMP/merge-package.bin" @flash_args)

      - name: Collect build outputs
        if: always()
        run: |
          out="$RUNNER_TEMP/fnos-verify"
          mkdir -p "$out/build/bootloader" "$out/build/partition_table"
          for f in build/fnos_monitor.bin build/fnos_monitor.elf build/fnos_monitor.map \
                   build/flasher_args.json build/flash_args; do
            if [ -f "$f" ]; then cp "$f" "$out/build/"; fi
          done
          if [ -f build/bootloader/bootloader.bin ]; then
            cp build/bootloader/bootloader.bin "$out/build/bootloader/"
          fi
          if [ -f build/partition_table/partition-table.bin ]; then
            cp build/partition_table/partition-table.bin "$out/build/partition_table/"
          fi
          if [ -f "$RUNNER_TEMP/verify.log" ]; then cp "$RUNNER_TEMP/verify.log" "$out/"; fi
          find "$out" -maxdepth 2 -type f -exec ls -l {} \; || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.run_id }}
          path: ${{ runner.temp }}/fnos-verify
          if-no-files-found: warn
          retention-days: 14

  release:
    name: publish firmware
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download build from the gate job
        uses: actions/download-artifact@v4
        with:
          name: verify-${{ github.run_id }}
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The gate built and exercised this zip; only the tag-specific name is new.
          mv artifacts/release/fnos-monitor-full.zip "fnos-monitor-${TAG}-full.zip"
          gh release create "$TAG" \
            "fnos-monitor-${TAG}-full.zip" \
            artifacts/build/fnos_monitor.bin \
            artifacts/build/bootloader/bootloader.bin \
            artifacts/build/partition_table/partition-table.bin \
            artifacts/build/fnos_monitor.elf \
            artifacts/build/fnos_monitor.map \
            artifacts/build/flasher_args.json \
            artifacts/release/FLASH.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Firmware built from $GITHUB_SHA by the CI gate. Download fnos-monitor-${TAG}-full.zip for the complete flash package (bootloader, partition table, app, flash_args and FLASH.txt). The fnOS companion package is built locally; see README." \
            --verify-tag
