<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-data-flow-title runtime-data-flow-desc" id="runtime-data-flow-root">
<title id="runtime-data-flow-title">运行时数据流：NAS 采集，开发板拉取并显示</title>
<desc id="runtime-data-flow-desc">NAS 上的采集器只读本机状态写成快照，遥测服务用 HTTPS 与令牌提供；开发板的 fnos_poll 任务定时拉取，写入环形缓存，由 LVGL 线程渲染六页。Docker 为可选辅助数据源。</desc>
<defs>
  <marker id="rt-arw" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#8A8C96"/></marker>
  <marker id="rt-arw-blue" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#6F8CFF"/></marker>
  <style>
    text { font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .zone { font-size: 13px; letter-spacing: 2.4px; fill: #6E7079; }
    .name { font-size: 22px; font-weight: 600; fill: #E9EBF2; }
    .sub { font-size: 15px; fill: #9A9CA6; }
    .sub2 { font-size: 15px; fill: #75777F; }
    .label { font-size: 14px; fill: #B4B6C0; }
    .note { font-size: 13px; fill: #75777F; }
  </style>
</defs>

<g id="rt-base">
  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#08080A"/>
  <text class="zone" x="64" y="86">NAS / FNOS</text>
  <line x1="64" y1="372" x2="1136" y2="372" stroke="#2C2C30" stroke-width="1" stroke-dasharray="4 6"/>
  <text class="zone" x="64" y="396">ESP32-P4 / LVGL</text>
  <g id="rt-legend">
    <line x1="64" y1="566" x2="112" y2="566" stroke="#8A8C96" stroke-width="2"/>
    <text class="note" x="120" y="571">数据流</text>
    <line x1="216" y1="566" x2="264" y2="566" stroke="#8A8C96" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="note" x="272" y="571">可选或旁路</text>
    <rect x="404" y="559" width="26" height="14" rx="3" fill="#17171A" stroke="#2C2C30"/>
    <text class="note" x="438" y="571">进程或任务</text>
    <text class="note" x="600" y="571">界面只读快照，不在 UI 线程发请求</text>
  </g>
</g>

<g id="rt-arw-1">
  <path d="M312 170 H340" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#rt-arw)"/>
</g>
<g id="rt-arw-2">
  <path d="M604 170 H632" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#rt-arw)"/>
</g>
<g id="rt-arw-6">
  <path d="M188 260 V244 H480 V226" stroke="#8A8C96" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#rt-arw)"/>
</g>
<g id="rt-arw-3">
  <path d="M772 220 V404" stroke="#6F8CFF" stroke-width="2" fill="none" marker-end="url(#rt-arw-blue)"/>
</g>
<g id="rt-arw-4">
  <path d="M640 470 H612" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#rt-arw)"/>
</g>
<g id="rt-arw-5">
  <path d="M348 470 H320" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#rt-arw)"/>
</g>

<g id="rt-lab-3">
  <rect x="786" y="296" width="124" height="26" rx="4" fill="#08080A"/>
  <text class="label" x="795" y="314">令牌 + TLS</text>
</g>

<g id="rt-card-a1">
  <rect x="64" y="120" width="248" height="100" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="84" y="158">NAS 只读采集</text>
  <text class="sub mono" x="84" y="184">fnos_collector.py</text>
  <text class="sub2" x="84" y="205">负载 · 网络 · 卷 · 温度</text>
</g>
<g id="rt-card-a2">
  <rect x="356" y="120" width="248" height="100" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="376" y="158">快照 + 历史</text>
  <text class="sub" x="376" y="184">1 s 采样 · 历史 300 行</text>
  <text class="sub2" x="376" y="205">阵列 · 磁盘 · ZFS ARC</text>
</g>
<g id="rt-card-a3">
  <rect x="648" y="120" width="248" height="100" rx="12" fill="#1B1B20" stroke="#6F8CFF" stroke-width="1.5"/>
  <text class="name" x="668" y="158">遥测服务</text>
  <text class="sub" x="668" y="184">HTTPS :8798 · 令牌</text>
  <text class="sub2" x="668" y="205">独立采集器 HTTP :8799</text>
</g>
<g id="rt-card-docker">
  <rect x="64" y="260" width="248" height="84" rx="12" fill="#141416" stroke="#434347" stroke-dasharray="5 4"/>
  <text class="name" x="84" y="294">Docker 辅助</text>
  <text class="sub2" x="84" y="320">只读 docker.sock · 显式启用</text>
</g>

<g id="rt-card-b1">
  <rect x="648" y="404" width="248" height="100" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="668" y="442">fnos_poll 任务</text>
  <text class="sub" x="668" y="468">每 200 ms 拉一次</text>
  <text class="sub2" x="668" y="489">退避 1→5 s · 3 次判离线</text>
</g>
<g id="rt-card-b2">
  <rect x="356" y="404" width="248" height="100" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="376" y="442">快照缓存</text>
  <text class="sub" x="376" y="468">环形 600 点</text>
  <text class="sub2" x="376" y="489">失败保留最后有效值</text>
</g>
<g id="rt-card-b3">
  <rect x="64" y="404" width="248" height="100" rx="12" fill="#1B2020" stroke="#36E07A" stroke-width="1.5"/>
  <text class="name" x="84" y="442">LVGL 线程</text>
  <text class="sub" x="84" y="468">六页仪表与详情</text>
  <text class="sub2" x="84" y="489">只从缓存取值</text>
</g>
</svg>
