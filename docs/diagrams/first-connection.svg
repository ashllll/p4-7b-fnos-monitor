<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="first-connection-title first-connection-desc" id="first-connection-root">
<title id="first-connection-title">首次配对：从六位配对码到令牌落盘</title>
<desc id="first-connection-desc">NAS 管理页生成六位配对码，开发板屏幕上只输入这六位数字；设备用明文只取一次证书，把指纹显示在屏幕上与 NAS 管理页逐段比对，一致后用 HTTPS 提交配对，拿到令牌写入 NVS，之后进入总览并轮询状态。</desc>
<defs>
  <marker id="fc-arw" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#8A8C96"/></marker>
  <marker id="fc-arw-ok" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#36E07A"/></marker>
  <style>
    text { font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; }
    .name { font-size: 22px; font-weight: 600; fill: #E9EBF2; }
    .sub { font-size: 15px; fill: #9A9CA6; }
    .sub2 { font-size: 15px; fill: #75777F; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .label { font-size: 14px; fill: #B4B6C0; }
    .note { font-size: 13px; fill: #75777F; }
  </style>
</defs>

<g id="fc-base">
  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#08080A"/>
  <text class="zone" x="64" y="86" fill="#6E7079" font-size="13px" letter-spacing="2.4">首次配对</text>
  <text class="note" x="64" y="598">实线：设备请求　虚线：人工比对或失败分支　圆角框：屏幕步骤</text>
</g>

<g id="fc-arw-1">
  <path d="M344 172 H412" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#fc-arw)"/>
</g>
<g id="fc-arw-2">
  <path d="M720 172 H788" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#fc-arw)"/>
</g>
<g id="fc-arw-3">
  <path d="M956 224 V356" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#fc-arw)"/>
</g>
<g id="fc-arw-4">
  <path d="M816 424 H748" stroke="#8A8C96" stroke-width="2" fill="none" marker-end="url(#fc-arw)"/>
</g>
<g id="fc-arw-5">
  <path d="M440 424 H372" stroke="#36E07A" stroke-width="2" fill="none" marker-end="url(#fc-arw-ok)"/>
</g>
<g id="fc-arw-6">
  <path d="M204 224 V330 H900 V362" stroke="#8A8C96" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#fc-arw)"/>
</g>
<g id="fc-arw-7">
  <path d="M956 476 V502" stroke="#8A8C96" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#fc-arw)"/>
</g>

<g id="fc-lab-1">
  <rect x="350" y="146" width="60" height="22" rx="4" fill="#08080A"/>
  <text class="label" x="354" y="162">6 位码</text>
</g>
<g id="fc-lab-2">
  <rect x="966" y="286" width="42" height="22" rx="4" fill="#08080A"/>
  <text class="label" x="970" y="302">TLS</text>
</g>
<g id="fc-lab-3">
  <rect x="470" y="306" width="124" height="22" rx="4" fill="#08080A"/>
  <text class="label" x="474" y="322">指纹人工比对</text>
</g>
<g id="fc-lab-4">
  <rect x="872" y="484" width="70" height="22" rx="4" fill="#08080A"/>
  <text class="label" x="876" y="500">不一致</text>
</g>

<g id="fc-card-a">
  <rect x="64" y="120" width="280" height="104" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="84" y="158">NAS 管理页</text>
  <text class="sub" x="84" y="184">安装监控应用（FPK）</text>
  <text class="sub2" x="84" y="206">生成配对码 · 显示证书指纹</text>
</g>
<g id="fc-card-b">
  <rect x="440" y="120" width="280" height="104" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="460" y="158">屏幕输入配对码</text>
  <text class="sub" x="460" y="184">键盘只收 6 位数字</text>
  <text class="sub2" x="460" y="206">地址与端口不在屏幕配置</text>
</g>
<g id="fc-card-c">
  <rect x="816" y="120" width="280" height="104" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="836" y="158">取证书</text>
  <text class="sub mono" x="836" y="184">明文只放行 /api/v1/identity</text>
  <text class="sub2" x="836" y="206">拿到证书、端口与指纹</text>
</g>
<g id="fc-card-d">
  <rect x="816" y="372" width="280" height="104" rx="12" fill="#1B1B20" stroke="#FF9F43" stroke-width="1.5"/>
  <text class="name" x="836" y="410">比对指纹</text>
  <text class="sub" x="836" y="436">屏幕显示 SHA-256</text>
  <text class="sub2" x="836" y="458">与 NAS 管理页逐段比 · 一致才继续</text>
</g>
<g id="fc-card-e">
  <rect x="440" y="372" width="280" height="104" rx="12" fill="#17171A" stroke="#2C2C30"/>
  <text class="name" x="460" y="410">提交配对</text>
  <text class="sub mono" x="460" y="436">POST /api/v1/pair</text>
  <text class="sub2" x="460" y="458">200 + 非空令牌才算成功</text>
</g>
<g id="fc-card-f">
  <rect x="64" y="372" width="280" height="104" rx="12" fill="#1B2020" stroke="#36E07A" stroke-width="1.5"/>
  <text class="name" x="84" y="410">进入总览</text>
  <text class="sub" x="84" y="436">令牌与证书写入 NVS</text>
  <text class="sub2" x="84" y="458">此后轮询 /status</text>
</g>

<g id="fc-fail">
  <rect x="64" y="512" width="1032" height="62" rx="12" fill="#141416" stroke="#434347" stroke-dasharray="5 4"/>
  <text class="sub2" x="84" y="549">指纹不一致：取消配对，检查 NAS 地址、端口与证书；配对失败 5 次 / 300 s 会被限流</text>
</g>
</svg>
